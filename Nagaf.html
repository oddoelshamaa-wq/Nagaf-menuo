<script>
const fc={apiKey:"AIzaSyBor5YRDNrtxTbvwW-ev4krDQpES7CgSDY",authDomain:"nagaf-menuo-a04c3.firebaseapp.com",projectId:"nagaf-menuo-a04c3",storageBucket:"nagaf-menuo-a04c3.firebasestorage.app",messagingSenderId:"847128373372",appId:"1:847128373372:web:9a6cbf585914db0f5381f9",measurementId:"G-VBPSDN44S7"};
firebase.initializeApp(fc);const db=firebase.firestore();
let br=[],mi=[],st={},selB=null;
document.getElementById('fY').textContent=new Date().getFullYear();

function cM(){document.getElementById('mO').classList.add('hidden');const m=document.getElementById('mD');m.classList.add('hidden');m.classList.remove('flex')}

function showBranchModal() {
    document.getElementById('bO').classList.remove('hidden');

}

}
function selectBranch(id) {
    selB = id;
    const b = br.find(x => x.id === id);
    if(b) document.getElementById('selectedBranchNameNav').textContent = b.name;
    closeBranchModal();
    rMT();
    rMu();
}

function ec(l){if(!l)return null;let m=l.match(/[?&]q=([+-]?\d+\.?\d*),([+-]?\d+\.?\d*)/);if(m)return{lat:+m[1],lng:+m[2]};m=l.match(/@([+-]?\d+\.?\d*),([+-]?\d+\.?\d*)/);if(m)return{lat:+m[1],lng:+m[2]};m=l.match(/!3d([+-]?\d+\.?\d*)!4d([+-]?\d+\.?\d*)/);if(m)return{lat:+m[1],lng:+m[2]};return null}

function applySt(s){
    const c=s.primaryColor||'#f59e0b';
    if(s.siteName){document.getElementById('navN').textContent=s.siteName;document.getElementById('hTitle').textContent=s.siteName;document.getElementById('fN').textContent=s.siteName;document.title=s.siteName}

    if(s.bgColor)document.body.style.backgroundColor=s.bgColor;
    if(s.bgImage){document.getElementById('bgLayer').style.backgroundImage=`url(${s.bgImage})`;document.getElementById('bgLayer').style.opacity='0.15'}else{document.getElementById('bgLayer').style.backgroundImage='none'}
    document.getElementById('navN').style.color=c;document.getElementById('hIcon').style.background=`linear-gradient(135deg,${c},${c}dd)`;document.getElementById('navIcon').style.background=`linear-gradient(135deg,${c},${c}dd)`;document.getElementById('menuB').style.background=c+'1a';document.getElementById('menuB').style.color=c;

    const cards=[];
    if(s.whatsapp)cards.push({icon:'mdi:whatsapp',label:'واتساب',val:s.whatsapp,href:'https://wa.me/'+s.whatsapp.replace(/[^0-9]/g,''),bg:'from-emerald-500 to-emerald-700',bdr:'border-emerald-500/20'});
    if(s.callCenter)cards.push({icon:'mdi:headset',label:'خط السخن',val:s.callCenter,href:'tel:'+s.callCenter.replace(/[^0-9+]/g,''),bg:'from-blue-500 to-blue-700',bdr:'border-blue-500/20'});
    if(s.phone)cards.push({icon:'mdi:phone',label:'تليفون',val:s.phone,href:'tel:'+s.phone.replace(/[^0-9+]/g,''),bg:'from-green-500 to-green-700',bdr:'border-green-500/20'});
    const ctB=document.getElementById('ctBox'),ctC=document.getElementById('ctCards');
    if(cards.length){ctB.classList.remove('hidden');ctC.innerHTML=cards.map(x=>`<a href="${x.href}" target="_blank" class="block p-5 rounded-2xl bg-[#1c1917]/60 border ${x.bdr} hover:scale-[1.02] transition-all text-center"><div class="w-12 h-12 rounded-xl bg-gradient-to-br ${x.bg} flex items-center justify-center mx-auto mb-3 shadow-lg"><span class="iconify text-white text-2xl" data-icon="${x.icon}"></span></div><h4 class="font-bold text-white text-sm mb-1">${x.label}</h4><p class="text-stone-400 text-xs" style="direction:ltr">${x.val}</p></a>`).join('')}else{ctB.classList.add('hidden')}
}

function rBr(){
    const c=document.getElementById('bGrid');
    if(!br.length){c.innerHTML='<div class="col-span-full text-center py-4 text-stone-500">لا توجد فروع</div>';return}
    
    // Render About Section Branch Cards
    c.innerHTML=br.map((b,i)=>{
        const cnt=mi.filter(x=>x.branchId===b.id).length,co=b.location||ec(b.mapLink);
        let mu='';if(co)mu=`https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d500!2d${co.lng}!3d${co.lat}!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2z${co.lat}%2C${co.lng}!5e0!3m2!1sar!2seg!4v1`;
        let dl=b.mapLink||(co?`https://www.google.com/maps?q=${co.lat},${co.lng}`:'');
        return`<div class="su card-h bg-[#1c1917]/60 rounded-2xl border border-stone-800/50 overflow-hidden" style="animation-delay:${i*.1}s"><div class="flex flex-col sm:flex-row"><div class="p-5 sm:w-2/5 flex flex-col justify-between"><div><div class="flex items-center gap-3 mb-3"><div class="w-10 h-10 rounded-lg bg-amber-500/10 flex items-center justify-center flex-shrink-0 border border-amber-500/10"><span class="iconify text-amber-400 text-xl" data-icon="mdi:store"></span></div><div><h4 class="font-bold text-white">${b.name}</h4>${b.address?`<p class="text-stone-400 text-xs mt-0.5">${b.address}</p>`:''}</div></div><span class="text-xs text-stone-500">${cnt} صنف</span></div>${dl?`<div class="flex items-center gap-2 mt-4"><a href="${dl}" target="_blank" class="flex-1 py-2 rounded-lg bg-blue-500/10 text-blue-400 text-xs font-bold text-center hover:bg-blue-500/20 transition-all flex items-center justify-center gap-1 border border-blue-500/20"><span class="iconify" data-icon="mdi:google" style="font-size:14px"></span>Maps</a>${co?`<a href="https://www.google.com/maps/dir/?api=1&destination=${co.lat},${co.lng}" target="_blank" class="py-2 px-3 rounded-lg bg-green-500/10 text-green-400 text-xs font-bold hover:bg-green-500/20 transition-all flex items-center gap-1 border border-green-500/20"><span class="iconify" data-icon="mdi:directions" style="font-size:14px"></span>اتجه</a>`:''}</div>`:''}</div><div class="sm:w-3/5 h-40 sm:h-auto min-h-[160px] relative">${mu?`<iframe src="${mu}" class="w-full h-full border-0" style="filter:brightness(.8)contrast(1.1)saturate(.8)" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe><a href="${dl}" target="_blank" class="absolute inset-0 z-10"></a>`:`<div class="w-full h-full bg-stone-900/50 flex items-center justify-center"><span class="iconify text-stone-700 text-3xl" data-icon="mdi:map-off"></span></div>`}</div></div></div>`}).join('')

    // Handle Branch Selection Modal
    if(br.length > 0) {
        document.getElementById('branchBtnNav').classList.remove('hidden');
        const bl = document.getElementById('branchListModal');
        bl.innerHTML = br.map(b => `
            <button onclick="selectBranch('${b.id}')" class="branch-btn w-full p-4 rounded-xl border border-stone-700/50 flex items-center gap-4 hover:bg-stone-800/80 text-right">
                <div class="w-10 h-10 rounded-lg bg-amber-500/10 flex items-center justify-center flex-shrink-0 border border-amber-500/10"><span class="iconify text-amber-400 text-xl" data-icon="mdi:store"></span></div>
                <div class="flex-1">
                    <h4 class="font-bold text-white text-sm">${b.name}</h4>
                    ${b.address ? `<p class="text-stone-500 text-xs mt-0.5">${b.address}</p>` : ''}
                </div>
                <span class="iconify text-stone-600 text-lg" data-icon="mdi:chevron-left"></span>
            </button>
        `).join('');
        
        // Auto show modal if no branch selected yet
        if(!selB && br.length >= 1) {
            if(br.length === 1) { // Auto select if only 1 branch
                selectBranch(br[0].id);
            } else {
                showBranchModal();
            }
        }
    }
}

function rMT(){
    const c=document.getElementById('mTabs');
    // We hide tabs because the modal handles branch selection now. If you want tabs back, remove the next line.
    c.innerHTML = ''; 
    return;
    
    /* If you want to keep tabs alongside the modal, remove the return above
    if(!br.length){c.innerHTML='';return}
    let h=`<button onclick="sMB(null)" class="btab flex-shrink-0 px-4 py-2 rounded-xl text-xs font-semibold border border-stone-700/50 ${selB===null?'on bg-amber-500 border-transparent':'bg-stone-900/50 text-stone-400 hover:bg-stone-800'}">الكل</button>`;
    h+=br.map(b=>`<button onclick="sMB('${b.id}')" class="btab flex-shrink-0 px-4 py-2 rounded-xl text-xs font-semibold border border-stone-700/50 ${selB===b.id?'on bg-amber-500 border-transparent':'bg-stone-900/50 text-stone-400 hover:bg-stone-800'}">${b.name}</button>`).join('');
    c.innerHTML=h
    */
}
function sMB(id){selB=id;rMT();rMu()}

function rMu(){
    const c=document.getElementById('mGrid'),e=document.getElementById('mE');
    let it=mi;
    if(selB) it=it.filter(x=>x.branchId===selB); // Filter by selected branch
    
    if(!it.length){c.innerHTML='';e.classList.remove('hidden');return}
    e.classList.add('hidden');
    
    c.innerHTML=it.map((t,i)=>{
        const b=br.find(x=>x.id===t.branchId),img=t.imageUrl||`https://picsum.photos/seed/${t.id}/400/300`;
        
        // Calculate display price string
        let priceStr = '';
        if(t.itemType === 'dish' && t.prices && t.prices.length > 0) {
            priceStr = `${t.prices[0].price} ج.م`;
        } else if(t.prices && t.prices.length > 0) {
            const minP = Math.min(...t.prices.map(p => p.price));
            priceStr = `تبدأ من ${minP} ج.م`;
        } else if(t.price) {
            priceStr = `${t.price} ج.م`; // Fallback for old data
        } else {
            priceStr = '0 ج.م';
        }

        return`<div class="mcard card-h su bg-[#1c1917]/60 rounded-2xl border border-stone-800/50 overflow-hidden cursor-pointer" onclick="sID('${t.id}')" style="animation-delay:${i*.05}s"><div class="relative h-48 overflow-hidden"><img src="${img}" class="mimg w-full h-full object-cover" onerror="this.src='https://picsum.photos/seed/fb/400/300'"><div class="absolute inset-0" style="background:linear-gradient(to top,rgba(28,25,23,.8),transparent 60%)"></div>${b?`<div class="absolute top-3 right-3 px-3 py-1 rounded-lg bg-black/40 text-xs text-stone-300 font-medium flex items-center gap-1" style="backdrop-filter:blur(4px)"><span class="iconify text-amber-400" data-icon="mdi:map-marker" style="font-size:12px"></span>${b.name}</div>`:''}</div><div class="p-4"><h3 class="font-bold text-white mb-1">${t.name}</h3><p class="text-stone-500 text-xs mb-3 line-clamp-2">${t.description||''}</p><div class="flex items-center justify-between"><span class="text-lg font-black text-amber-400">${priceStr}</span><span class="iconify text-stone-600" data-icon="mdi:information-outline"></span></div></div></div>`}).join('')
}

function sID(id){
    const t=mi.find(x=>x.id===id);if(!t)return;
    const b=br.find(x=>x.id===t.branchId);
    document.getElementById('dI').src=t.imageUrl||'https://picsum.photos/seed/df/400/300';
    document.getElementById('dN').textContent=t.name;
    document.getElementById('dB').textContent=b?b.name:'';
    document.getElementById('dD').textContent=t.description||'';
    
    const pc = document.getElementById('dPC');
    let html = '';
    
    // Render Prices inside Modal
    if(t.itemType === 'dish' && t.prices && t.prices.length > 0) {
        html = `<div class="text-3xl font-black text-amber-400">${t.prices[0].price} <span class="text-sm font-normal text-stone-500">جنيه</span></div>`;
    } else if(t.prices && t.prices.length > 0) {
        html = `<p class="text-xs text-stone-400 mb-2">اختر الحجم:</p><div class="flex flex-col gap-2 w-full">`;
              t.prices.forEach((p, idx) => {
            html += `<button onclick="selectSize(this, '${p.imageUrl || ''}')" class="size-btn w-full py-3 px-4 rounded-xl border border-stone-700 text-right flex justify-between items-center focus:outline-none">
                <span class="font-bold text-white">${p.label}</span>
                <span class="text-amber-400 font-bold">${p.price} ج.م</span>
            </button>`;
        });
        html += `</div>`;
    } else if(t.price) {
        html = `<div class="text-3xl font-black text-amber-400">${t.price} <span class="text-sm font-normal text-stone-500">جنيه</span></div>`; // Fallback
    } else {
        html = `<div class="text-stone-500 text-sm">غير متاح حالياً</div>`;
    }
    
    pc.innerHTML = html;
    
    document.getElementById('mO').classList.remove('hidden');const m=document.getElementById('mD');m.classList.remove('hidden');m.classList.add('flex')
