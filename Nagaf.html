<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>مينيو</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#050510;--bg2:#0a0a1e;--bg3:#10102e;
  --card:rgba(11,11,50,.55);--card2:rgba(11,11,50,.45);
  --red:#9e0001;--red2:#c40001;--red3:#7a0001;--red4:#ff2222;
  --blue:#0b0b7a;--blue2:#1a1a9a;--blue3:#060650;--blue4:#2e2ec0;
  --glass:rgba(255,255,255,.04);--glass2:rgba(255,255,255,.07);
  --text:#ffffff;--text2:rgba(255,255,255,.6);--text3:rgba(255,255,255,.35);
  --r:18px;--r2:24px;
  --shadow1:0 4px 20px rgba(0,0,0,.4);
  --shadow2:0 12px 48px rgba(0,0,0,.6);
  --shadow3:0 24px 80px rgba(0,0,0,.8);
}
html{scroll-behavior:smooth}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--red3);border-radius:10px}
a{color:inherit;text-decoration:none}

#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}

#loader{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);transition:opacity .8s cubic-bezier(.4,0,.2,1),visibility .8s}
#loader.out{opacity:0;visibility:hidden;pointer-events:none}
.ld-wrap{position:relative;width:100px;height:100px}
.ld-ring{position:absolute;inset:0;border:2px solid transparent;border-top-color:var(--red);border-radius:50%;animation:ldSpin 1.2s linear infinite}
.ld-ring:nth-child(2){inset:8px;border-top-color:var(--blue);animation-duration:1.8s;animation-direction:reverse}
.ld-ring:nth-child(3){inset:16px;border-top-color:var(--red2);animation-duration:.9s}
.ld-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--red);animation:ldPulse 2s ease infinite}
@keyframes ldSpin{to{transform:rotate(360deg)}}
@keyframes ldPulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.ld-text{margin-top:28px;font-size:15px;font-weight:300;color:var(--red);letter-spacing:4px;animation:ldPulse 2s ease infinite .5s}

.ambient{position:fixed;pointer-events:none;z-index:0;border-radius:50%;filter:blur(120px)}
.amb1{width:600px;height:600px;background:radial-gradient(circle,rgba(158,0,1,.08),transparent 70%);top:-250px;right:-200px;animation:ambFloat 20s ease-in-out infinite}
.amb2{width:500px;height:500px;background:radial-gradient(circle,rgba(11,11,122,.1),transparent 70%);bottom:-200px;left:-180px;animation:ambFloat 25s ease-in-out infinite reverse}
.amb3{width:300px;height:300px;background:radial-gradient(circle,rgba(158,0,1,.05),transparent 70%);top:40%;left:50%;animation:ambFloat 18s ease-in-out infinite 5s}
@keyframes ambFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-40px) scale(1.1)}66%{transform:translate(-20px,30px) scale(.95)}}

#app{position:relative;z-index:1;min-height:100vh}

.hdr{position:sticky;top:0;z-index:200;padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between;background:rgba(5,5,16,.85);backdrop-filter:blur(30px) saturate(1.5);border-bottom:1px solid rgba(158,0,1,.12);transition:all .4s}
.hdr.scrolled{height:56px;box-shadow:0 4px 30px rgba(0,0,0,.5)}
.hdr-back{width:40px;height:40px;border-radius:12px;border:1px solid rgba(158,0,1,.2);background:var(--glass);color:var(--red);font-size:16px;cursor:pointer;display:none;align-items:center;justify-content:center;transition:all .35s}
.hdr-back:hover{border-color:var(--red);transform:translateX(3px);box-shadow:0 0 20px rgba(158,0,1,.2)}
.hdr-back.show{display:flex}
.hdr-logo-area{display:flex;align-items:center;gap:10px;cursor:pointer}
.hdr-logo-img{width:38px;height:38px;border-radius:10px;object-fit:contain;border:1px solid rgba(158,0,1,.15);background:var(--bg2);padding:2px;transition:transform .3s}
.hdr-logo-area:hover .hdr-logo-img{transform:scale(1.08)}
.hdr-logo-text{font-size:20px;font-weight:900;letter-spacing:1px;background:linear-gradient(135deg,var(--red2),var(--red4),var(--red2));background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 3s ease infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.hdr-spacer{width:40px}

.hotline-bar{background:linear-gradient(135deg,var(--red),var(--red3));padding:10px 24px;display:flex;align-items:center;justify-content:center;gap:16px;position:relative;z-index:199;overflow:hidden}
.hotline-bar::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);animation:hlShine 3s ease infinite}
@keyframes hlShine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.hotline-label{font-size:13px;font-weight:700;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:6px}
.hotline-label i{animation:ldPulse 1.5s ease infinite}
.hotline-num{font-size:18px;font-weight:900;color:#fff;letter-spacing:2px;direction:ltr}
.hotline-num a{color:#fff;text-decoration:none;transition:color .3s}
.hotline-num a:hover{color:var(--red4)}

.hero{position:relative;overflow:hidden}
.hero-cover{width:100%;height:340px;object-fit:cover;filter:brightness(.45)}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,5,16,.3) 0%,rgba(5,5,16,.7) 60%,var(--bg) 100%)}
.hero-content{position:absolute;bottom:0;left:0;right:0;padding:0 24px 40px;text-align:center;z-index:2}
.hero-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:3px;color:var(--red2);text-transform:uppercase;background:rgba(158,0,1,.1);border:1px solid rgba(158,0,1,.2);padding:6px 18px;border-radius:30px;margin-bottom:16px}
.hero-tag i{font-size:8px;animation:ldPulse 2s ease infinite}
.hero-title{font-size:clamp(32px,7vw,52px);font-weight:900;line-height:1.1;margin-bottom:10px;background:linear-gradient(135deg,var(--text) 0%,var(--red2) 50%,var(--text) 100%);background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 4s ease infinite}
.hero-sub{font-size:15px;font-weight:300;color:var(--text2);max-width:420px;margin:0 auto;line-height:1.7}
.hero-line{width:60px;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);margin:20px auto 0;border-radius:2px}

.info-sec{padding:0 24px 32px;max-width:900px;margin:0 auto}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.info-card{background:var(--card);backdrop-filter:blur(20px);border:1px solid rgba(158,0,1,.1);border-radius:var(--r);padding:20px;display:flex;align-items:flex-start;gap:14px;transition:all .4s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.info-card::before{content:'';position:absolute;top:0;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,var(--red2),transparent);opacity:.5}
.info-card:hover{transform:translateY(-4px);border-color:rgba(158,0,1,.25);box-shadow:0 12px 40px rgba(158,0,1,.08)}
.info-ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.info-ic.red{background:rgba(158,0,1,.12);color:var(--red2);border:1px solid rgba(158,0,1,.15)}
.info-ic.blue{background:rgba(11,11,122,.15);color:var(--blue4);border:1px solid rgba(11,11,122,.2)}
.info-body{flex:1;min-width:0}
.info-label{font-size:11px;color:var(--text3);font-weight:600;letter-spacing:1px;margin-bottom:4px;text-transform:uppercase}
.info-val{font-size:15px;font-weight:700;line-height:1.5}
.info-val a{color:var(--red2);transition:color .3s}
.info-val a:hover{color:var(--red4)}
.info-small{font-size:12px;color:var(--text3);margin-top:2px;line-height:1.6}
.hours-grid{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.hours-row{display:flex;justify-content:space-between;font-size:12px}
.hours-day{color:var(--text2);font-weight:500}
.hours-time{color:#fff;font-weight:800;direction:ltr;unicode-bidi:isolate;white-space:nowrap;font-variant-numeric:tabular-nums}
.delivery-hours-banner{position:relative;z-index:5;display:flex;align-items:center;gap:14px;width:min(560px,calc(100% - 32px));margin:-22px auto 28px;padding:16px 18px;border:1px solid rgba(196,0,1,.28);border-radius:16px;background:linear-gradient(110deg,rgba(158,0,1,.16),rgba(11,11,50,.96) 52%,rgba(11,11,122,.2));box-shadow:0 12px 36px rgba(0,0,0,.32),0 0 24px rgba(158,0,1,.08);backdrop-filter:blur(16px)}
.delivery-hours-icon{display:grid;place-items:center;width:44px;height:44px;flex:0 0 44px;border:1px solid rgba(196,0,1,.25);border-radius:12px;background:rgba(158,0,1,.14);color:var(--red4);font-size:18px}
.delivery-hours-content{display:flex;flex-direction:column;gap:4px;min-width:0}
.delivery-hours-label{color:rgba(255,255,255,.62);font-size:12px;font-weight:600}
.delivery-hours-time{color:#fff;font-size:16px;font-weight:800;line-height:1.5}
.info-hours{margin-top:6px}
.hours-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border:1px solid rgba(11,11,122,.18);border-radius:10px;background:rgba(11,11,122,.08);color:var(--text);font:inherit;text-align:right;cursor:pointer;transition:background .2s,border-color .2s}
.hours-toggle:hover,.hours-toggle:focus-visible{background:rgba(11,11,122,.16);border-color:rgba(46,46,192,.4);outline:none}
.hours-toggle-main{display:flex;align-items:center;gap:7px;flex-shrink:0;font-size:13px;font-weight:800}
.hours-toggle-main i{color:var(--blue4)}
.hours-toggle-summary{display:flex;align-items:center;gap:6px;min-width:0;color:rgba(255,255,255,.78);font-size:12px;font-weight:600;text-align:left;white-space:nowrap}
.hours-toggle-summary .hours-time{color:#fff}
.hours-chevron{flex-shrink:0;color:var(--text3);font-size:11px;transition:transform .2s}
.hours-toggle[aria-expanded="true"] .hours-chevron{transform:rotate(180deg)}
.hours-list[hidden]{display:none!important}
.hours-list{display:flex;flex-direction:column;gap:3px;margin-top:8px;padding:8px 6px;border-top:1px solid rgba(255,255,255,.12)}
.hours-list .hday{color:rgba(255,255,255,.82);font-weight:600}
.hours-list .htime{min-width:110px;color:#fff;text-align:left;font-weight:800}
.gps-link{display:inline-flex;align-items:center;gap:6px;color:var(--blue4);font-weight:600;font-size:13px;padding:6px 14px;border-radius:10px;background:rgba(11,11,122,.12);border:1px solid rgba(11,11,122,.15);transition:all .3s;margin-top:6px}
.gps-link:hover{background:rgba(11,11,122,.25);border-color:rgba(11,11,122,.3);transform:translateX(-3px);box-shadow:0 4px 15px rgba(11,11,122,.15)}
.gps-link i{font-size:14px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:8px 24px 32px;max-width:600px;margin:0 auto}
.st-card{background:var(--card);backdrop-filter:blur(20px);border:1px solid rgba(158,0,1,.08);border-radius:var(--r);padding:24px 12px;text-align:center;position:relative;overflow:hidden;transition:all .4s cubic-bezier(.2,.8,.2,1)}
.st-card::before{content:'';position:absolute;top:0;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,var(--red2),transparent);opacity:.5}
.st-card:hover{transform:translateY(-6px);border-color:rgba(158,0,1,.2);box-shadow:0 12px 40px rgba(158,0,1,.08)}
.st-icon{font-size:20px;color:var(--red3);margin-bottom:8px;display:block}
.st-num{font-size:36px;font-weight:900;display:block;background:linear-gradient(135deg,var(--red),var(--red4));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2}
.st-label{font-size:12px;color:var(--text3);font-weight:500;margin-top:4px;letter-spacing:1px}

.sec-hdr{display:flex;align-items:center;gap:12px;padding:8px 24px 20px}
.sec-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,rgba(158,0,1,.15),rgba(11,11,122,.1));display:flex;align-items:center;justify-content:center;color:var(--red2);font-size:16px;border:1px solid rgba(158,0,1,.12)}
.sec-title{font-size:22px;font-weight:800}
.sec-count{font-size:12px;color:var(--red3);background:var(--glass2);padding:3px 10px;border-radius:20px;font-weight:600}

.br-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding:0 24px 40px}
.br-card{perspective:1000px;cursor:pointer}
.br-card-in{position:relative;background:var(--card);backdrop-filter:blur(20px);border:1px solid rgba(158,0,1,.08);border-radius:var(--r2);overflow:hidden;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s;will-change:transform}
.br-card:hover .br-card-in{box-shadow:var(--shadow2),0 0 60px rgba(158,0,1,.06)}
.br-card-in::before{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(158,0,1,.06) 0%,transparent 40%);pointer-events:none;z-index:2;border-radius:var(--r2)}
.br-img-wrap{height:200px;position:relative;overflow:hidden}
.br-img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.8,.2,1);will-change:transform}
.br-card:hover .br-img{transform:scale(1.12)}
.br-img-ov{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 30%,rgba(5,5,16,.6) 70%,var(--bg) 100%);z-index:1}
.br-shine{position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.03) 45%,rgba(255,255,255,.06) 50%,rgba(255,255,255,.03) 55%,transparent 60%);transform:translateX(-100%);transition:transform .8s;z-index:1;pointer-events:none}
.br-card:hover .br-shine{transform:translateX(100%)}
.br-badge{position:absolute;top:16px;left:16px;z-index:3;font-size:10px;font-weight:700;letter-spacing:2px;color:#fff;background:linear-gradient(135deg,var(--red),var(--red2));padding:5px 14px;border-radius:20px;box-shadow:0 4px 15px rgba(158,0,1,.3)}
.br-status{position:absolute;top:16px;right:16px;z-index:3;width:10px;height:10px;border-radius:50%;background:#4ade80;box-shadow:0 0 12px rgba(74,222,128,.5);animation:statusPulse 2s ease infinite}
@keyframes statusPulse{0%,100%{box-shadow:0 0 4px rgba(74,222,128,.3)}50%{box-shadow:0 0 16px rgba(74,222,128,.6)}}
.br-status-closed{background:#ef4444;box-shadow:0 0 12px rgba(239,68,68,.5);animation:statusPulseClosed 2s ease infinite}
@keyframes statusPulseClosed{0%,100%{box-shadow:0 0 4px rgba(239,68,68,.3)}50%{box-shadow:0 0 16px rgba(239,68,68,.6)}}
.br-status-closing{background:#f59e0b;box-shadow:0 0 12px rgba(245,158,11,.5);animation:statusPulseClosing 2s ease infinite}
@keyframes statusPulseClosing{0%,100%{box-shadow:0 0 4px rgba(245,158,11,.3)}50%{box-shadow:0 0 16px rgba(245,158,11,.6)}}
.br-body{padding:20px 24px 24px;position:relative;z-index:3}
.br-name{font-size:22px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.br-name-dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0;box-shadow:0 0 8px rgba(158,0,1,.4)}
.br-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.br-tag{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:5px;background:var(--glass2);border:1px solid rgba(255,255,255,.04);padding:4px 10px;border-radius:8px}
.br-tag i{color:var(--blue4);font-size:9px}
.br-desc{font-size:13px;color:var(--text3);line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:16px}
.br-cta{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--red2);padding:10px 22px;border-radius:14px;border:1px solid rgba(158,0,1,.2);background:linear-gradient(135deg,rgba(158,0,1,.08),rgba(158,0,1,.02));transition:all .4s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.br-cta::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--red),var(--red2));opacity:0;transition:opacity .4s}
.br-cta span,.br-cta i{position:relative;z-index:1}
.br-card:hover .br-cta{color:#fff;border-color:transparent;transform:translateX(-4px);box-shadow:0 6px 25px rgba(158,0,1,.25)}
.br-card:hover .br-cta::before{opacity:1}
.br-gps{display:inline-flex;align-items:center;gap:5px;color:var(--blue4);font-size:12px;font-weight:600;padding:5px 12px;border-radius:8px;background:rgba(11,11,122,.1);border:1px solid rgba(11,11,122,.12);transition:all .3s;margin-bottom:10px}
.br-gps:hover{background:rgba(11,11,122,.2);border-color:rgba(11,11,122,.25)}

.br-hours{display:flex;flex-direction:column;gap:3px;margin-bottom:12px;padding:10px 14px;background:rgba(11,11,122,.08);border:1px solid rgba(11,11,122,.1);border-radius:10px}
.br-hours-title{font-size:10px;color:var(--text3);font-weight:600;letter-spacing:1px;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.br-hours-title i{color:var(--blue4);font-size:9px}
.br-hours .hours-toggle{padding:5px 4px;border:0;background:transparent}
.br-hours .hours-toggle-main{font-size:11px}
.br-hours .hours-toggle-summary{font-size:10px}
.br-hours .hours-list{margin-top:4px;padding:6px 4px 0}
.br-hours-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px;font-size:13px;line-height:1.5;padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.07)}
.br-hours-row:last-child{border-bottom:0}
.br-hours-row .hday{color:var(--text2);font-weight:500}
.br-hours-row .htime{color:#fff;font-size:13px;font-weight:800;direction:ltr;unicode-bidi:isolate;text-align:left;white-space:nowrap}
.br-hours-row.today{background:rgba(158,0,1,.08);padding:2px 6px;border-radius:4px}
.br-hours-row.today .hday{color:var(--red2)}
.br-hours-row.today .htime{color:var(--red4)}

#menuView{display:none}
.mv-herd{position:relative;height:300px;overflow:hidden}
.mv-herd img.mv-img{width:100%;height:100%;object-fit:cover;filter:brightness(.7)}
.mv-herd-ov{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,5,16,.2) 0%,rgba(5,5,16,.5) 50%,var(--bg) 100%)}
.mv-herd-info{position:absolute;bottom:28px;right:28px;left:28px;z-index:2}
.mv-herd-logo{width:60px;height:60px;border-radius:14px;object-fit:contain;border:2px solid rgba(158,0,1,.25);background:var(--bg2);padding:3px;margin-bottom:10px;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.mv-herd-name{font-size:32px;font-weight:900;margin-bottom:6px}
.mv-herd-sub{font-size:14px;color:var(--text2);font-weight:300;display:flex;align-items:center;gap:8px}
.mv-herd-sub i{color:var(--blue4)}
.mv-gps-link{display:inline-flex;align-items:center;gap:6px;color:var(--blue4);font-size:13px;font-weight:600;padding:6px 14px;border-radius:10px;background:rgba(11,11,122,.15);border:1px solid rgba(11,11,122,.2);transition:all .3s;margin-top:8px}
.mv-gps-link:hover{background:rgba(11,11,122,.3);box-shadow:0 4px 15px rgba(11,11,122,.15)}

.mv-hours{display:flex;flex-direction:column;gap:3px;margin-top:10px;padding:10px 16px;background:rgba(11,11,122,.1);border:1px solid rgba(11,11,122,.15);border-radius:12px;max-width:380px}
.mv-hours-title{font-size:11px;color:var(--text3);font-weight:600;letter-spacing:1px;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.mv-hours-title i{color:var(--blue4);font-size:10px}
.mv-hours .hours-toggle{padding:5px 4px;border:0;background:transparent}
.mv-hours .hours-toggle-main{font-size:11px}
.mv-hours .hours-list{margin-top:4px;padding:6px 4px 0}
.mv-hours-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px;font-size:13px;line-height:1.5;padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.07)}
.mv-hours-row:last-child{border-bottom:0}
.mv-hours-row .hday{color:var(--text2);font-weight:500}

<script>

firebase.initializeApp(fc);const db=firebase.firestore();

const DEFAULTS = {
  name: 'نجف',

  ]
};

const DAY_NAMES = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

let br=[],mi=[],settings={},selB=null,cDone=false,activeCat='الكل';

/* ═══════════════════════════════════════
   دوال المواعيد وحالة الفرع
   ═══════════════════════════════════════ */

function getTodayName(){
  return DAY_NAMES[new Date().getDay()];
}

function parseTime(t){
  if(!t) return null;
  const match=String(t).trim().match(/^(\d{1,2}):?(\d{0,2})\s*(ص|م|am|pm)?$/i);
  if(!match) return null;
  let hour=parseInt(match[1],10);
  const minute=parseInt(match[2]||'0',10);
  const period=(match[3]||'').toLowerCase();
  if((period==='م'||period==='pm')&&hour!==12) hour+=12;
  if((period==='ص'||period==='am')&&hour===12) hour=0;
  if(hour>23||minute>59) return null;
  return hour*60+minute;
}

function isBranchOpen(hours){
  if(!hours||!hours.length) return {open:true,status:'open'};
  const now=new Date();
  const todayIndex=now.getDay();
  const nowMin=now.getHours()*60+now.getMinutes();
  const todayName=DAY_NAMES[todayIndex];
  const yesterdayName=DAY_NAMES[(todayIndex+6)%7];
  const todayHours=hours.find(h=>h.day===todayName);
  const yesterdayHours=hours.find(h=>h.day===yesterdayName);
  const getRange=dayHours=>{
    if(!dayHours||!dayHours.time) return null;
    const parts=dayHours.time.split('-');
    if(parts.length<2) return null;
    const start=parseTime(parts[0].trim());
    const end=parseTime(parts[1].trim());
    return start===null||end===null?null:{start,end};
  };
  const todayRange=getRange(todayHours);
  const yesterdayRange=getRange(yesterdayHours);
  let minutesUntilClose=null;

  if(todayRange){
    const close=todayRange.end<=todayRange.start?todayRange.end+1440:todayRange.end;
    const adjustedNow=nowMin<todayRange.start&&todayRange.end<=todayRange.start?nowMin+1440:nowMin;
    if(adjustedNow>=todayRange.start&&adjustedNow<close) minutesUntilClose=close-adjustedNow;
  }
  if(minutesUntilClose===null&&yesterdayRange&&yesterdayRange.end<yesterdayRange.start&&nowMin<yesterdayRange.end){
    minutesUntilClose=yesterdayRange.end-nowMin;
  }

  const open=minutesUntilClose!==null;
  const status=!open?'closed':minutesUntilClose<=60?'closing':'open';
  return {open,status};
}

function buildHoursHTML(hours,cssPrefix,showTitle,idSuffix){
  if(!hours||!hours.length) return '';
  const todayName=getTodayName();
  const listId=`hours-${cssPrefix}-${idSuffix}`;
  const today=hours.find(h=>h.day===todayName);
  const todayTime=today&&today.time?today.time:'مغلق';
  const title=showTitle?'مواعيد العمل':'المواعيد';
  const rows=hours.map(h=>{
    const isToday=h.day===todayName?' today':'';
    return `<div class="${cssPrefix}-row${isToday}"><span class="hday">${h.day}</span><span class="htime" dir="ltr">${h.time||'مغلق'}</span></div>`;
  }).join('');
  return `<div class="${cssPrefix}"><button type="button" class="hours-toggle" aria-expanded="false" aria-controls="${listId}" onclick="toggleHours(event,'${listId}')"><span class="hours-toggle-main"><i class="fas fa-clock"></i><span>${title}</span></span><span class="hours-toggle-summary"><span>اليوم</span><span class="hours-time" dir="ltr">${todayTime}</span></span><i class="fas fa-chevron-down hours-chevron"></i></button><div id="${listId}" class="hours-list" hidden>${rows}</div></div>`;
}

function toggleHours(event,listId){
  event.preventDefault();
  event.stopPropagation();
  const list=document.getElementById(listId);
  const button=event.currentTarget;
  if(!list||!button) return;
  const expanded=button.getAttribute('aria-expanded')==='true';
  button.setAttribute('aria-expanded',String(!expanded));
  list.hidden=expanded;
}

function extractCoords(link){
  if(!link)return null;
  let m=link.match(/[?&]q=([+-]?\d+\.?\d*),([+-]?\d+\.?\d*)/);
  if(m)return{lat:+m[1],lng:+m[2]};
  m=link.match(/@([+-]?\d+\.?\d*),([+-]?\d+\.?\d*)/);
  if(m)return{lat:+m[1],lng:+m[2]};
  m=link.match(/!3d([+-]?\d+\.?\d*)!4d([+-]?\d+\.?\d*)/);
  if(m)return{lat:+m[1],lng:+m[2]};
  return null;
}

function applySettings(s){
  const name=s.siteName||DEFAULTS.name;

  const phone=s.phone||DEFAULTS.phone;
  const whatsapp=s.whatsapp||DEFAULTS.whatsapp;
  const desc=s.siteDesc||s.aboutText||DEFAULTS.description;

  document.getElementById('hdrLogoText').textContent=name;
  if(document.getElementById('hdrLogoImg')) document.getElementById('hdrLogoImg').src=logo;
  document.getElementById('heroCover').src=cover;
  document.getElementById('heroTitle').textContent=name;
  document.getElementById('heroSub').textContent=desc;
  if(document.getElementById('ftrLogo')) document.getElementById('ftrLogo').src=logo;
  document.title=name+' - مينيو';

  if(hotline){
    document.getElementById('hotlineLink').textContent=hotline;

  }else document.getElementById('hotlineBar').style.display='none';

  if(whatsapp){
    document.getElementById('fabWa').href='https://wa.me/'+whatsapp;
    document.getElementById('fabWa').style.display='';
  }else document.getElementById('fabWa').style.display='none';

  const infoGrid=document.getElementById('infoGrid');
  let cards='';

  const addr=s.address||DEFAULTS.address;
  const mapLink=s.mapLink||'';
  const coords=extractCoords(mapLink);
  const gpsUrl=coords?`https://www.google.com/maps/search/?api=1&query=${coords.lat},${coords.lng}`:(mapLink||'');
  if(addr||gpsUrl){
    cards+=`<div class="info-card reveal">

        <div class="info-label">العنوان الرئيسي</div>
        ${addr?`<div class="info-val">${addr}</div>`:''}

      </div>
    </div>`;
  }
  infoGrid.innerHTML=cards;

  const c=document.getElementById('bgCanvas'),ctx=c.getContext('2d');
  let w,h,pts=[],mouse={x:-1000,y:-1000};
  function resize(){w=c.width=innerWidth;h=c.height=innerHeight;pts=[];for(let i=0;i<50;i++)pts.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.2+.3,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,o:Math.random()*.3+.05,phase:Math.random()*Math.PI*2,clr:Math.random()>.5?[158,0,1]:[11,11,122]});}
  function draw(t){ctx.clearRect(0,0,w,h);for(let i=0;i<pts.length;i++){const p=pts[i];p.x+=p.vx;p.y+=p.vy;if(p.x<-10)p.x=w+10;if(p.x>w+10)p.x=-10;if(p.y<-10)p.y=h+10;if(p.y>h+10)p.y=-10;const dx=mouse.x-p.x,dy=mouse.y-p.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<150){const f=(150-dist)/150*.15;p.vx+=dx/dist*f;p.vy+=dy/dist*f}p.vx*=.99;p.vy*=.99;const glow=Math.sin(t*.001+p.phase)*.5+.5;ctx.beginPath();ctx.arc(p.x,p.y,p.r+glow*.4,0,Math.PI*2);ctx.fillStyle=`rgba(${p.clr[0]},${p.clr[1]},${p.clr[2]},${p.o+glow*.08})`;ctx.fill();for(let j=i+1;j<pts.length;j++){const p2=pts[j],dx2=p.x-p2.x,dy2=p.y-p2.y,d2=dx2*dx2+dy2*dy2;if(d2<12000){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p2.x,p2.y);ctx.strokeStyle=`rgba(${p.clr[0]},${p.clr[1]},${p.clr[2]},${.025*(1-d2/12000)})`;ctx.lineWidth=.5;ctx.stroke()}}}requestAnimationFrame(draw);}
  resize();requestAnimationFrame(draw);addEventListener('resize',resize);addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
}();

addEventListener('scroll',()=>{document.getElementById('hdr').classList.toggle('scrolled',scrollY>20)});
function toast(m){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
function animCounters(){if(cDone)return;cDone=true;document.querySelectorAll('.st-num').forEach(el=>{const tgt=+el.dataset.t;if(!tgt){el.textContent='0';return}let cur=0;const inc=Math.max(1,Math.ceil(tgt/50));const t=setInterval(()=>{cur+=inc;if(cur>=tgt){cur=tgt;clearInterval(t)}el.textContent=cur},25);});}

function initTilt(){document.querySelectorAll('.br-card').forEach(card=>{const inner=card.querySelector('.br-card-in');let raf=null;card.addEventListener('mousemove',e=>{if(raf)cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;inner.style.transform=`rotateY(${-x*14}deg) rotateX(${y*10}deg) scale3d(1.03,1.03,1.03)`;inner.style.boxShadow=`${-x*20}px ${y*20}px 60px rgba(0,0,0,.5),${-x*10}px ${y*10}px 30px rgba(158,0,1,.06)`;});});card.addEventListener('mouseleave',()=>{inner.style.transform='rotateY(0) rotateX(0) scale3d(1,1,1)';inner.style.boxShadow=''});});}
function initReveal(){const obs=new IntersectionObserver(e=>{e.forEach(x=>{if(x.isIntersecting){x.target.classList.add('vis');obs.unobserve(x.target)}})},{threshold:.1});document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));}

function renderStats(){const a=document.getElementById('statsArea');const bc=br.length,mc=mi.length,cc=new Set(mi.map(i=>i.category||i.cat||'')).size;a.innerHTML=`<div class="st-card reveal"><i class="fas fa-store st-icon"></i><span class="st-num" data-t="${bc}">0</span><div class="st-label">فرع</div></div><div class="st-card reveal"><i class="fas fa-utensils st-icon"></i><span class="st-num" data-t="${mc}">0</span><div class="st-label">صنف</div></div><div class="st-card reveal"><i class="fas fa-layer-group st-icon"></i><span class="st-num" data-t="${cc}">0</span><div class="st-label">تصنيف</div></div>`;document.getElementById('brCount').textContent=bc;setTimeout(()=>{animCounters();initReveal()},100);}

function getGpsUrl(b){if(b.mapLink){const c=extractCoords(b.mapLink);if(c) return `https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lng}`;return b.mapLink;}if(b.location && b.location.lat && b.location.lng){return `https://www.google.com/maps/search/?api=1&query=${b.location.lat},${b.location.lng}`;}const addr=b.address||b.addr||'';if(addr) return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}`;return null;}

/* ═══════════════════════════════════════
   عرض الفروع مع المواعيد
   ═══════════════════════════════════════ */
  function compareBranchOrder(a,b){
    const aHasOrder=Number.isFinite(a.sortOrder),bHasOrder=Number.isFinite(b.sortOrder);
    if(aHasOrder&&bHasOrder&&a.sortOrder!==b.sortOrder)return a.sortOrder-b.sortOrder;
    if(aHasOrder!==bHasOrder)return aHasOrder?-1:1;
    const aCreated=a.createdAt&&a.createdAt.toMillis?a.createdAt.toMillis():0;
    const bCreated=b.createdAt&&b.createdAt.toMillis?b.createdAt.toMillis():0;
    return bCreated-aCreated;
  }

  function refreshLiveViews(){
    br=(primaryBranches.length?primaryBranches:legacyBranches).slice().sort(compareBranchOrder);
    mi=primaryMenuItems.length?primaryMenuItems:legacyMenuItems.length?legacyMenuItems:legacyItems;
    applySettings(settings);
    cDone=false;
    renderStats();
    renderBranches();
    if(selB){
      const currentBranch=br.find(branch=>branch.id===selB.id);
      if(currentBranch){
        selB=currentBranch;
        renderMvHeader();
        renderCats();
        renderMenu();
      }else goBack();
    }
    if(liveSettingsReady&&liveBranchesReady&&liveItemsReady) document.getElementById('loader').classList.add('out');
  }

  function renderBranches(){
  const g=document.getElementById('brGrid');
  if(!br.length){g.innerHTML='<div class="empty"><i class="fas fa-store-slash"></i><p>لا توجد فروع حالياً</p></div>';return}
  
  g.innerHTML=br.map((b,i)=>{
    const img=b.image||b.img||b.photo||b.cover||'';
    const name=b.name||b.n||'فرع';
    const desc=b.desc||b.description||b.info||'';
    const addr=b.address||b.addr||b.location||'';
    const phone=b.phone||b.tel||'';
    const city=b.city||b.area||'';
    const items=mi.filter(m=>(m.branchId||m.bid||m.branch)===b.id).length;
    const gpsUrl=getGpsUrl(b);
    const branchHours=b.hours||[];
    const hoursHtml=buildHoursHTML(branchHours,'br-hours',true,`branch-${i}`);
    const statusInfo=isBranchOpen(branchHours);
    
    let statusClass='br-status';
    if(statusInfo.status==='closed') statusClass+=' br-status-closed';
    else if(statusInfo.status==='closing') statusClass+=' br-status-closing';

    const statusLabelMap={open:'مفتوح دلوقتي',closing:'هيقفل قريب',closed:'مقفول دلوقتي'};
    const statusLabel=statusLabelMap[statusInfo.status]||'';

    const features=[];
    if(b.driveThru) features.push(`<div class="br-tag"><i class="fas fa-car"></i> درايف موت</div>`);
    if(b.takeAway) features.push(`<div class="br-tag"><i class="fas fa-bag-shopping"></i> تيك أواي</div>`);

    return `<div class="br-card reveal" onclick="selectBranch('${b.id}')" style="transition-delay:${i*.06}s">
      <div class="br-card-in">
        ${img?`<div class="br-img-wrap"><img class="br-img" src="${img}" alt="${name}" loading="lazy" onerror="this.parentElement.innerHTML='<div style=\\'height:100%;background:linear-gradient(135deg,var(--bg3),var(--bg2))\\'></div>'"><div class="br-img-ov"></div><div class="br-shine"></div></div>`:`<div class="br-img-wrap" style="height:80px;background:linear-gradient(135deg,var(--bg3),var(--bg2))"></div>`}
        ${items?`<div class="br-badge">${items} صنف</div>`:''}
        <div class="${statusClass}" data-branch-indicator="${i}"></div>
        <div class="br-body">
          <div class="br-name"><span class="br-name-dot"></span>${name}</div>
          <div class="br-tags">
            ${city?`<div class="br-tag"><i class="fas fa-location-dot"></i>${city}</div>`:''}
            ${phone?`<div class="br-tag"><i class="fas fa-phone"></i>${phone}</div>`:''}
            ${addr?`<div class="br-tag"><i class="fas fa-map"></i>${addr}</div>`:''}
            ${features.join('')}
            <div class="br-tag br-status-tag ${statusInfo.status}" data-branch-status="${i}"><i class="fas fa-circle" style="font-size:6px"></i><span>${statusLabel}</span></div>
          </div>
          ${gpsUrl?`<a href="${gpsUrl}" target="_blank" rel="noopener" class="br-gps" onclick="event.stopPropagation()"><i class="fas fa-map-location-dot"></i> فتح الموقع على الخريطة</a>`:''}
          ${hoursHtml}
          ${desc?`<div class="br-desc">${desc}</div>`:''}
          <div class="br-cta"><span>عرض المنيو</span><i class="fas fa-arrow-left"></i></div>
        </div>
      </div>
    </div>`;
  }).join('');
  setTimeout(()=>{initTilt();initReveal()},50);
}

function refreshBranchStatuses(){
  const labels={open:'مفتوح دلوقتي',closing:'هيقفل قريب',closed:'مقفول دلوقتي'};
  br.forEach((branch,index)=>{
    const status=isBranchOpen(branch.hours||[]).status;
    const indicator=document.querySelector(`[data-branch-indicator="${index}"]`);
    if(indicator) indicator.className=`br-status${status==='closed'?' br-status-closed':status==='closing'?' br-status-closing':''}`;
    const tag=document.querySelector(`[data-branch-status="${index}"]`);
    if(tag){
      tag.className=`br-tag br-status-tag ${status}`;
      const text=tag.querySelector('span');
      if(text) text.textContent=labels[status];
    }
  });
  const badge=document.getElementById('mvStatusBadge');
  if(badge&&selB){
    const status=isBranchOpen(selB.hours||[]).status;
    badge.className=`mv-status-badge ${status}`;
    document.getElementById('mvStatusText').textContent=labels[status];
  }
}

/* ═══════════════════════════════════════
   اختيار فرع والرجوع
   ═══════════════════════════════════════ */
function selectBranch(id){
  selB=br.find(b=>b.id===id);
  if(!selB)return;
  document.getElementById('brView').style.display='none';
  document.getElementById('menuView').style.display='block';
  document.getElementById('backBtn').classList.add('show');
  document.getElementById('hdrLogoText').textContent=selB.name||selB.n||'المنيو';
  document.getElementById('hdrSp').style.display='none';
  document.getElementById('hotlineBar').style.display='none';
  renderMvHeader();renderCats();renderMenu();
  window.scrollTo({top:0,behavior:'smooth'});
}

function goBack(){
  selB=null;
  document.getElementById('menuView').style.display='none';
  document.getElementById('brView').style.display='block';
  document.getElementById('backBtn').classList.remove('show');
  document.getElementById('hdrLogoText').textContent=settings.siteName||DEFAULTS.name;
  document.getElementById('hdrSp').style.display='';
  if(settings.callCenter)document.getElementById('hotlineBar').style.display='';
  document.getElementById('searchIn').value='';
  setTimeout(()=>{initTilt();initReveal()},100);
}

/* ═══════════════════════════════════════
   هيدر صفحة المنيو مع المواعيد
   ═══════════════════════════════════════ */
function renderMvHeader(){
  const h=document.getElementById('mvHerd');
  const img=selB.image||selB.img||selB.photo||selB.cover||'';
  const name=selB.name||selB.n||'';
  const desc=selB.desc||selB.description||'';
  const addr=selB.address||selB.addr||'';
  const gpsUrl=getGpsUrl(selB);
  const logo=document.getElementById('hdrLogoImg').src;
  const branchHours=selB.hours||[];
  const hoursHtml=buildHoursHTML(branchHours,'mv-hours',true,'selected');
  const statusInfo=isBranchOpen(branchHours);
  
  const statusBadgeClass=statusInfo.status;
  const statusBadgeText=statusInfo.status==='open'?'مفتوح دلوقتي':statusInfo.status==='closing'?'هيقفل قريب':'مقفول دلوقتي';

  h.innerHTML=`${img?`<img class="mv-img" src="${img}" alt="" onerror="this.style.display='none'">`:''}
    <div class="mv-herd-ov"></div>
    <div class="mv-herd-info">
      <img class="mv-herd-logo" src="${logo}" alt="لوجو">
      <div class="mv-herd-name">${name}</div>
      <div class="mv-herd-sub"><i class="fas fa-location-dot"></i>${addr||desc||'منيو الفرع'}</div>
      <div class="mv-status-badge ${statusBadgeClass}" id="mvStatusBadge"><span class="dot"></span><span id="mvStatusText">${statusBadgeText}</span></div>
      ${gpsUrl?`<a href="${gpsUrl}" target="_blank" rel="noopener" class="mv-gps-link"><i class="fas fa-map-location-dot"></i> فتح الموقع على الخريطة</a>`:''}
      ${hoursHtml}

/* ═══════════════════════════════════════
   المنيو والتصنيفات
   ═══════════════════════════════════════ */
function getBrItems(){return mi.filter(m=>(m.branchId||m.bid||m.branch)===selB.id)}

function renderCats(){
  const items=getBrItems();
  const catsSet=new Set();
  items.forEach(i=>{
    const cat=i.category||i.cat||'';
    if(cat)catsSet.add(cat);
  });
  const cats=['الكل',...catsSet];
  activeCat='الكل';
  document.getElementById('catsArea').innerHTML=cats.map(c=>`<button class="cat ${c==='الكل'?'on':''}" onclick="setCat('${c}',this)"><span>${c}</span></button>`).join('');
}

function setCat(c,btn){activeCat=c;document.querySelectorAll('.cat').forEach(b=>b.classList.remove('on'));btn.classList.add('on');renderMenu();}

function selectPrice(cardId,priceIdx){
  const card=document.getElementById(cardId);
  if(!card) return;
  const btns=card.querySelectorAll('.mc-opt-btn');
  btns.forEach(b=>b.classList.remove('active'));
  btns[priceIdx].classList.add('active');
  const prices=JSON.parse(card.dataset.prices);
  const curr=card.dataset.curr;
  const priceEl=card.querySelector('.mc-price-val');
  if(priceEl) priceEl.textContent=prices[priceIdx].price;
  const baseImg=card.dataset.baseImg;
  const imgEl=card.querySelector('.mc-img img');
  if(imgEl){const sizeImg=prices[priceIdx].imageUrl||baseImg;if(sizeImg){imgEl.src=sizeImg;imgEl.parentElement.style.display='';}else imgEl.parentElement.style.display='none';}
}

function normalizeSizeLabel(label,index){
  const value=String(label||'').trim();
  if(!value)return '';
  const labels={small:'صغير',quarter:'صغير',quarterKilo:'صغير',eighthKilo:'صغير',quarterC:'صغير','ربع':'صغير','ربع كيلو':'صغير',medium:'وسط',half:'وسط',halfKilo:'وسط','نص':'وسط','نص كيلو':'وسط',large:'كبير',kilo:'كبير',keizer:'كبير','كيزر':'كبير','كبير':'كبير'};
  return labels[value]||['صغير','وسط','كبير'][index]||value;
}

function renderMenu(){
  const g=document.getElementById('mGrid');
  let items=getBrItems();
  const q=document.getElementById('searchIn').value.trim().toLowerCase();
  if(q)items=items.filter(i=>(i.name||'').toLowerCase().includes(q)||(i.description||'').toLowerCase().includes(q));

  if(activeCat!=='الكل'){items=items.filter(i=>(i.category||i.cat||'')===activeCat);}

  if(!items.length){g.innerHTML='<div class="empty"><i class="fas fa-utensils"></i><p>لا توجد أصناف</p></div>';return}

  g.innerHTML=items.map((m,i)=>{
    const cardId='mc-'+m.id+'-'+i;
    const name=m.name||'';
    const desc=m.description||'';
    const baseImg=m.imageUrl||m.image||m.img||'';
    const cat=m.category||m.cat||'';
    const curr=m.currency||m.cur||'ج.م';
    const prices=m.prices||[];
    const hasImg=!!baseImg||prices.some(price=>!!price.imageUrl);

    let priceHtml='';
    let optionsHtml='';
    let currentImg=prices[0]?.imageUrl||baseImg||prices.find(price=>price.imageUrl)?.imageUrl||'';
    let dataPrices='';

    if(prices.length===0){priceHtml=`<div class="mc-price">0 <small>${curr}</small></div>`;}
    else if(prices.length===1){const sizeLabel=(m.itemType||'dish')==='dish'?'':normalizeSizeLabel(prices[0].label||prices[0].size,0);priceHtml=`${sizeLabel?`<div class="mc-size-label">${sizeLabel}</div>`:''}<div class="mc-price"><span class="mc-price-val">${prices[0].price}</span> <small>${curr}</small></div>`;}
    else {
      const firstPrice=prices[0].price;
      priceHtml=`<div class="mc-price"><span class="mc-price-val">${firstPrice}</span> <small>${curr}</small></div>`;
      optionsHtml=`<div class="mc-options">${prices.map((p,idx)=>{
        const label=normalizeSizeLabel(p.label||p.size,idx)||`خيار ${idx+1}`;
        const isActive=idx===0?' active':'';
        return `<button class="mc-opt-btn${isActive}" onclick="event.stopPropagation(); selectPrice('${cardId}', ${idx})">${label}</button>`;
      }).join('')}</div>`;
      currentImg=prices[0].imageUrl||baseImg||prices.find(price=>price.imageUrl)?.imageUrl||'';
      dataPrices=`data-prices='${JSON.stringify(prices)}' data-curr="${curr}" data-base-img="${baseImg}"`;
    }

    return `<div class="mc ${hasImg?'':'no-img'}" id="${cardId}" ${dataPrices} style="animation:fadeUp .4s ease ${i*.03}s both">
      <div class="mc-in">
        ${hasImg?`<div class="mc-img"><img src="${currentImg}" alt="${name}" loading="lazy" onclick="event.stopPropagation();window.open(this.currentSrc,'_blank','noopener')" onerror="this.parentElement.style.display='none'"><div class="mc-img-ov"></div></div>`:''}
        <div class="mc-body">
          ${cat?`<div class="mc-cat">${cat}</div>`:''}
          <div class="mc-name">${name}</div>
          ${desc?`<div class="mc-desc">${desc}</div>`:''}
          ${optionsHtml}
          ${priceHtml}
        </div>
      </div>
    </div>`;
  }).join('');
}

function filterMenu(){renderMenu()}

/* ═══════════════════════════════════════
   تحميل البيانات من Firebase
   ═══════════════════════════════════════ */
function loadData(){
  db.collection('settings').doc('main').onSnapshot(snapshot=>{
    settings=snapshot.exists?snapshot.data():{};
    liveSettingsReady=true;
    refreshLiveViews();
  },error=>{
    console.error(error);
    settings={};
    liveSettingsReady=true;
    refreshLiveViews();
  });

  db.collection('branches').onSnapshot(snapshot=>{
    primaryBranches=snapshot.docs.map(doc=>({id:doc.id,...doc.data()}));
    liveBranchesReady=true;
    if(primaryBranches.length||legacyBranchesLoaded){refreshLiveViews();return;}
    legacyBranchesLoaded=true;
    db.collection('branch').get().then(legacySnapshot=>{
      legacyBranches=legacySnapshot.docs.map(doc=>({id:doc.id,...doc.data()}));
    }).catch(console.error).finally(refreshLiveViews);
  },error=>{
    console.error(error);
    liveBranchesReady=true;
    refreshLiveViews();
  });

  db.collection('menuItems').onSnapshot(snapshot=>{
    primaryMenuItems=snapshot.docs.map(doc=>({id:doc.id,...doc.data()}));
    liveItemsReady=true;
    if(primaryMenuItems.length||legacyMenuLoaded){refreshLiveViews();return;}
    legacyMenuLoaded=true;
    db.collection('menu').get().then(legacySnapshot=>{
      legacyMenuItems=legacySnapshot.docs.map(doc=>({id:doc.id,...doc.data()}));
      if(legacyMenuItems.length)return null;
      return db.collection('items').get().then(itemsSnapshot=>{
        legacyItems=itemsSnapshot.docs.map(doc=>({id:doc.id,...doc.data()}));
      });
    }).catch(console.error).finally(refreshLiveViews);
  },error=>{
    console.error(error);
    liveItemsReady=true;
    refreshLiveViews();
  });
}

loadData();
setInterval(refreshBranchStatuses,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden) refreshBranchStatuses()});
</script>
